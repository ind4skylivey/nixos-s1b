name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      # local/ is gitignored, so CI evaluates the public *.example.nix
      # templates (see hosts/vm/default.nix). Evaluation only, no builds.
      - name: nix flake check
        run: nix flake check --no-build --show-trace
      - name: formatting (nixfmt)
        run: nix fmt -- --check $(git ls-files '*.nix')
